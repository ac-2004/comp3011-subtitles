# configures the application name, graceful shutdown and external transcription settings.

spring.application.name=Assignment1

# api
openai.api.key=${OPENAI_API_KEY:}
openai.transcription.url=${OPENAI_TRANSCRIPTION_URL:https://api.openai.com/v1/audio/transcriptions}

# shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

logging.level.comp3011.assignment1=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB